<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Uzun Mesafe Atış Simülasyonu</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-top: 0;
            color: #4CAF50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        .error {
            color: #ff5252;
            margin-top: 10px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Giriş Yap</h2>
        <p>Simülasyona erişmek için şifreyi giriniz.</p>
        <input type="password" id="password" placeholder="Şifre" onkeyup="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">Giriş</button>
        <div id="error-msg" class="error">Hatalı şifre!</div>
    </div>

    <script>
        // ŞİFREYİ BURADAN DEĞİŞTİREBİLİRSİNİZ
        const PASSWORD = "123";

        function checkPassword() {
            const input = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (input === PASSWORD) {
                // Şifre doğruysa oturum açıldığını kaydet
                sessionStorage.setItem('authenticated', 'true');
                // Ana sayfaya yönlendir
                window.location.href = 'index.html';
            } else {
                errorMsg.style.display = 'block';
                // Animasyon için
                const container = document.querySelector('.login-container');
                container.style.transform = 'translateX(10px)';
                setTimeout(() => container.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => container.style.transform = 'translateX(0)', 200);
            }
        }
    </script>
</body>

</html>
