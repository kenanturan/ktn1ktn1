    <a href="index.html" class="back-btn">← Ana Menüye Dön</a>

            style="width:100%; margin-bottom:4px; text-align:left; background:#333; color:#eee; border:1px solid #444; cursor:pointer; padding:8px; border-radius:4px; transition:0.2s;">Sınıf
            Eğitimi</button>
    </div>

    <div id="player-container"></div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        let rufflePlayerInstance = null;

        function loadSWF(filename) {
            console.log("Manual load requested: " + filename);
            if (rufflePlayerInstance) {
                rufflePlayerInstance.load({
                    url: filename,
                    allowScriptAccess: true,
                    backgroundColor: "#1a1a1a",
                    base: "",
                    upgradeToHttps: false,
                    letterbox: "on",
                });
            } else {
                alert("Player henüz yüklenmedi, lütfen bekleyin.");
            }
        }

        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            container.appendChild(player);
            rufflePlayerInstance = player;

            // Initial Load
            player.load({
                url: "main.swf",
                backgroundColor: "#1a1a1a",
                allowScriptAccess: true,
                upgradeToHttps: false,
                letterbox: "on",
            });
        });
    </script>
</body>

</html>
