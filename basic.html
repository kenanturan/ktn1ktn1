<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzun Mesafe Atış Simülasyonu - Temel Seviye</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Back button styling */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            z-index: 100;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #555;
        }

        .back-btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← Ana Menüye Dön</a>

    <!-- Debug Console -->
    <div id="debug-console"
        style="position: fixed; bottom: 0; left: 0; right: 0; height: 150px; background: rgba(0,0,0,0.9); color: #0f0; font-family: 'Courier New', monospace; font-size: 12px; overflow-y: auto; z-index: 99999; padding: 10px; border-top: 2px solid #0f0; pointer-events: none;">
        <div style="border-bottom: 1px solid #333; margin-bottom: 5px;"><strong>DEBUG CONSOLE (Hata Ayıklama)</strong>
        </div>
        <div id="debug-logs"></div>
    </div>

    <div id="player-container"></div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        // Logger function
        function log(msg) {
            const el = document.getElementById("debug-logs");
            if (!el) return;
            const line = document.createElement("div");
            line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
            el.appendChild(line);
            el.parentElement.scrollTop = el.parentElement.scrollHeight;
            console.log(msg);
        }

        window.onerror = function (msg) { log("JS ERROR: " + msg); };

        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            log("Ruffle JS loaded.");

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            container.appendChild(player);

            log("Player created.");

            // FSCommand Handler
            player.addEventListener("fscommand", (event) => {
                log("FSCOMMAND: command='" + event.command + "', args='" + event.args + "'");

                const cmd = event.command.toLowerCase();
                const args = event.args.toLowerCase();

                if (cmd === "quit" || cmd === "exit") {
                    log("Quitting...");
                    window.location.href = "index.html";
                }

                // EXEC Handler - Attempt to auto-fix .exe calls
                if (cmd === "exec") {
                    let target = event.args; // Keep original casing for filename

                    // Convert typical windows paths/extensions
                    target = target.replace(".exe", ".swf").replace(".bat", ".swf");
                    target = target.replace(/\\/g, "/"); // Fix backslashes

                    log("ATTEMPTING LOAD: " + target);

                    player.load({
                        url: target,
                        allowScriptAccess: true,
                        backgroundColor: "#1a1a1a",
                        base: "", // Force root
                        upgradeToHttps: false
                    });
                }
            });

            // Initial Load
            player.load({
                url: "main.swf",
                backgroundColor: "#1a1a1a",
                allowScriptAccess: true,
                upgradeToHttps: false,
                forcedScale: true, // Fix scaling issues
                letterbox: "on",   // Fix aspect ratio
                logLevel: "info"
            });

            log("Loading main.swf...");
        });
    </script>
</body>

</html>
