<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzun Mesafe Atış Simülasyonu - Menü</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #e0e0e0;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 15px 0;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .btn-advanced {
            background-color: #2196F3;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .description {
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Uzun Mesafe Atış Simülasyonu</h1>

        <a href="basic.html" class="btn">TEMEL SEVİYE EĞİTİM</a>
        <a href="advanced.html" class="btn btn-advanced">İLERİ SEVİYE EĞİTİM</a>

        <div class="description">
            Oynamak istediğiniz zorluk seviyesini seçin.
        </div>
    </div>
</body>

</html>
