<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzun Mesafe Atış Simülasyonu - İleri Seviye</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Back button styling */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            z-index: 100;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #555;
        }

        .back-btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← Ana Menüye Dön</a>
    <div id="player-container"></div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const container = document.getElementById("player-container");
            // Simple loading message
            container.innerHTML = '<div style="color: white; text-align: center;"><h2>Yükleniyor...</h2></div>';

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            container.innerHTML = "";
            container.appendChild(player);

            player.load({
                url: "files/mainadv.swf",
                backgroundColor: "#1a1a1a",
                allowScriptAccess: true,
            });

            player.style.width = "100%";
            player.style.height = "100%";

            // Fix for "Main Menu" / "Quit" buttons
            player.addEventListener("fscommand", (event) => {
                const cmd = event.command.toLowerCase();
                if (cmd === "quit" || cmd === "exit" || cmd === "return") {
                    window.location.href = "index.html";
                }
            });
        });
    </script>
</body>

</html>
